name: AudioBook Bay Scraper

on:
  schedule:
    - cron: "0 6 * * 0"

  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages to scrape (each page = ~9 books, site has ~500 pages)"
        required: false
        default: "10"
      scrape_details:
        description: "Visit each book page for full metadata? (true/false)"
        required: false
        default: "true"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 openpyxl

      - name: Run scraper
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '10' }}
          SCRAPE_DETAILS: ${{ github.event.inputs.scrape_details || 'true' }}
          DELAY_MIN: "2.0"
          DELAY_MAX: "4.0"
        run: python scraper.py

      - name: Upload spreadsheet
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-spreadsheet
          path: output/*.xlsx
          retention-days: 30
